<style>
:root{--navy:#14306b;--blue:#4a7fba;--sky:#eef4fb;--red:#c8102e;--ink:#1b2430;--line:#b9c6d8;--ok:#1e8a4c}
*{box-sizing:border-box}
body{margin:0;background:#cfd6e0;color:var(--ink);font:14px/1.45 "Segoe UI",Tahoma,system-ui,sans-serif}
h1,h2,h3,h4{font-family:Cambria,"Times New Roman",serif;margin:0}
#bar{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 14px}
#bar button,.b{font:inherit;border:0;border-radius:6px;padding:7px 12px;cursor:pointer;background:#fff;color:var(--navy);font-weight:600}
#bar button.p{background:#ffd34d}#bar button:hover,.b:hover{filter:brightness(.93)}
#prog{flex:1 1 260px;min-width:220px;position:relative}
#prog button{background:transparent;color:#fff;padding:0;text-align:left;width:100%;font-weight:600}
.meter{height:8px;background:#ffffff33;border-radius:4px;margin-top:4px;overflow:hidden}.meter i{display:block;height:100%;background:#5fd38d;width:0;transition:width .3s}
#pop{display:none;position:absolute;top:44px;left:0;width:min(380px,92vw);max-height:60vh;overflow:auto;background:#fff;color:var(--ink);border-radius:8px;box-shadow:0 8px 30px #0006;padding:10px 14px;z-index:60}
#pop.on{display:block}#pop a{display:block;padding:3px 0;color:var(--navy);cursor:pointer;text-decoration:underline}
#saved{font-size:12px;opacity:.85}
#pages{padding:16px 8px}
.page{position:relative;width:min(210mm,100%);aspect-ratio:210/297;margin:0 auto 18px;background:#fff;border:2px solid var(--navy);box-shadow:0 4px 18px #0003;padding:0 0 20mm;overflow:visible}
.page::before,.page::after{content:"";position:absolute;top:6mm;width:7mm;height:7mm;border:2px solid var(--navy);background:#fff}
.page::before{left:-2px;border-left:0}.page::after{right:-2px;border-right:0}
.wm{display:block;position:absolute;left:4mm;bottom:14mm;width:30mm;aspect-ratio:580/668;background:var(--wm) center/contain no-repeat;opacity:.9;pointer-events:none}
.ft{position:absolute;left:0;right:0;bottom:0;pointer-events:none}
.zz{height:8mm;background:var(--zig) 0 0/100% 100%}
.ft p{margin:0;display:flex;justify-content:space-between;padding:1.2mm 8mm;font:700 3.6mm Arial,sans-serif;color:var(--navy);border-top:2px solid var(--navy)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5mm 12mm 3mm;position:relative;z-index:1}
.lg,.art{background-repeat:no-repeat;background-position:center;background-size:contain;cursor:pointer}
.hd .lg{height:17mm}.tuv{background-image:var(--tuv);aspect-ratio:1}.naq{background-image:var(--naqaae);aspect-ratio:65/62}.cur{background-image:var(--cur);aspect-ratio:72/59}.emb{background-image:var(--emb);aspect-ratio:47/54}
.fac{display:flex;align-items:center;gap:2mm;border-right:0}.fac div{display:flex;flex-direction:column;text-align:right;line-height:1.15;border-right:2px solid var(--navy);padding-right:2mm;color:var(--navy)}
.fac b{font:700 4.6mm Tahoma,Arial,sans-serif}.fac span{font:700 3.4mm Arial,sans-serif}
.bd{position:relative;z-index:1;padding:2mm 12mm 0}
.art{display:block;width:100%;cursor:pointer}.a-cover{background-image:var(--cover);aspect-ratio:922/453}.a-refl{background-image:var(--refl);aspect-ratio:306/270}.a-feed{background-image:var(--feed);aspect-ratio:301/161}
.scroll{background:linear-gradient(#e7e9ec,#cfd3d8);border:2px solid var(--navy);border-radius:10px;padding:6mm 8mm;text-align:center;margin:3mm 0 5mm;position:relative}
.scroll h1{font-size:7mm;line-height:1.25;color:#111}
.frame{border:1px solid var(--line);border-radius:10px;padding:3mm;margin-bottom:5mm;box-shadow:0 2px 6px #0002}
.stu{background:var(--blue);border:2px solid var(--navy);border-radius:9mm;padding:6mm 9mm;color:#fff;display:grid;gap:3.2mm}
.stu label{display:grid;grid-template-columns:34mm 1fr;align-items:end;gap:3mm;font:700 5mm Cambria,serif}
.stu input{background:transparent;border:0;border-bottom:2px dotted #fff;color:#fff;font:600 4.2mm "Segoe UI",sans-serif;padding:2px 4px;width:100%}
.stu input.y{color:#fff36b}.stu input:focus{outline:0;background:#ffffff22}
.sh{color:var(--navy);font-size:6.2mm;border-bottom:2px solid var(--navy);padding-bottom:2mm;margin:2mm 0 4mm;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sh b{color:var(--blue)}
.mk{color:var(--red);font-weight:700;font-family:Cambria,serif;white-space:nowrap}
.sub{color:var(--blue);font-size:5mm;margin:5mm 0 2mm;display:flex;justify-content:space-between;gap:8px}
.note{font-size:3.6mm;color:#333;margin:0 0 3mm}
ol.obj{margin:0 0 6mm;padding-left:6mm;font:4.1mm/1.5 Cambria,serif;text-align:justify}ol.obj li{margin-bottom:2.5mm}
table{border-collapse:collapse;width:100%}th,td{border:1px solid var(--line);padding:3px 6px;font-size:3.7mm;text-align:left}th{background:#dbe8f6;color:var(--navy)}
td input{width:100%;border:0;background:transparent;font:inherit;padding:3px}td input:focus{outline:2px solid var(--blue)}
.card{border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:8px;background:#fff;padding:3.2mm 4mm;margin-bottom:4mm;break-inside:avoid}
.card h4{color:var(--navy);font-size:4.6mm;display:flex;justify-content:space-between;gap:8px;margin-bottom:2mm}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:3mm}.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:3mm}
.f{display:block;margin-bottom:2.2mm}.f span{display:block;font:700 3.5mm Cambria,serif;color:var(--navy);margin-bottom:1px}
.f input,.f textarea{width:100%;border:1px solid var(--line);border-radius:5px;background:var(--sky);padding:5px 8px;font:inherit;resize:none;overflow:hidden}
.f input:focus,.f textarea:focus{outline:2px solid var(--blue);background:#fff}
.irat{display:inline-flex;align-items:center;gap:3mm;background:var(--navy);color:#fff;border-radius:99px;padding:2mm 5mm;font:700 4.4mm Cambria,serif}.irat input{width:26mm;border:0;border-radius:99px;padding:3px 10px;font:700 4.4mm Arial;text-align:center}
.zone{margin-top:2mm;outline:0}.zone:focus .imgs,.zone.drag .imgs{border-color:var(--blue);background:var(--sky)}
.zh{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:3.5mm;color:#4a5a70}.zh span{font-weight:700;color:var(--navy)}.zh .b{background:var(--blue);color:#fff;padding:4px 10px}
.imgs{display:flex;flex-wrap:wrap;gap:3mm;align-items:flex-start;align-content:flex-start;margin-top:1.5mm;height:40mm;min-height:28mm;padding:2mm;border:2px dashed var(--line);border-radius:8px;background:#fbfdff;resize:vertical;overflow:auto}.imgs:empty::before{content:'Dedicated picture area: drop, add or paste images here';color:#8a99ad;font-size:3.5mm;margin:auto;text-align:center}
.im{margin:0;position:relative;max-width:100%}.fr{border-radius:4px;overflow:hidden;border:1px solid var(--line);background:#fff}.fr img{display:block;width:100%;height:auto;object-fit:contain}
.im[data-fit=cover] .fr{aspect-ratio:4/3}.im[data-fit=cover] img{height:100%;object-fit:cover}
.tb{position:absolute;top:4px;left:4px;display:none;gap:2px;background:#000b;border-radius:6px;padding:3px;z-index:5;flex-wrap:wrap}.im:hover .tb,.im:focus-within .tb{display:flex}
.tb button{border:0;background:#fff;border-radius:4px;font-size:11px;padding:2px 6px;cursor:pointer}.tb button.del{background:#ffb3b3}
.cap{width:100%;border:0;border-bottom:1px dotted var(--line);font-size:3.4mm;text-align:center;background:transparent;margin-top:1px}
.sig canvas{width:100%;height:30mm;border:1px solid var(--line);border-radius:6px;background:#fff;touch-action:none;cursor:crosshair}
.sl{border-top:1.5px solid #333;margin-top:14mm;padding-top:1.5mm;text-align:center;font:italic 4mm Cambria,serif;color:var(--blue)}.sl b{display:block;color:var(--navy);font-style:normal}
.row{display:flex;gap:6px;margin-top:3px;flex-wrap:wrap}.row .b{font-size:12px;padding:3px 9px;background:#e5ecf6}
#lb{position:fixed;top:0;left:0;right:0;bottom:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:99;cursor:zoom-out}#lb.on{display:flex}#lb img{max-width:94vw;max-height:94vh}
#dlg{position:fixed;top:0;left:0;right:0;bottom:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:120;padding:16px}#dlg.on{display:flex}#dlg>div{background:#fff;border-radius:10px;padding:18px 20px;max-width:420px;box-shadow:0 10px 40px #0008}#dlg h3{color:var(--navy);font-size:19px;margin-bottom:6px}#dlg p{margin:0 0 12px}#dlg .b{font-size:14px;padding:8px 14px}
.stu input::placeholder{color:#ffffffa0;font-weight:400}.credit{text-align:center;margin:9mm 0 0;font:italic 3.6mm Cambria,serif;color:#4a5a70}
.notice{position:relative;margin:6mm 0 0;padding:4mm 12mm 4mm 5mm;border:1.5px solid var(--navy);border-left:6px solid var(--navy);border-radius:6px;background:#f4f8fd;font:3.8mm/1.5 Cambria,serif;color:#222}.notice b{display:block;color:var(--navy);margin-bottom:1mm}.notice p{margin:0}.nx{position:absolute;top:2mm;right:2mm;border:0;background:#e5ecf6;color:var(--red);border-radius:50%;width:6mm;height:6mm;cursor:pointer;font-size:3.4mm;line-height:1;padding:0}
.ft .cp{font:600 3.1mm Cambria,serif;color:#4a5a70}
.rm{color:var(--red);cursor:pointer;border:0;background:none;font-size:16px}
@media(max-width:640px){.page{aspect-ratio:auto}.stu label{grid-template-columns:1fr}#bar{position:static}.hd{padding:3mm 2mm 2mm;gap:3px}.hd .lg{height:9.5mm}.fac b{font-size:3.3mm}.fac span{font-size:2.5mm;white-space:nowrap}.fac div{padding-right:1mm}.bd{padding:2mm 3.5mm}.ft p{padding:1mm 3mm;font-size:2.8mm}.ft .cp{font-size:2.2mm}.sh{font-size:5mm}.stu{padding:5mm}}
@supports not (aspect-ratio:1/1){.hd .lg.tuv{width:17mm}.hd .lg.naq{width:17.8mm}.hd .lg.cur{width:20.7mm}.hd .lg.emb{width:14.8mm}.art{height:0}.a-cover{padding-top:49.13%}.a-refl{padding-top:88.24%}.a-feed{padding-top:53.49%}.page{min-height:297mm}.wm{height:34.5mm}}
@page{size:A4 portrait;margin:0}

<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const MK=m=>`<span class="mk">(${m.toFixed(2)} mark${m>1?'s':''})</span>`;
const HD=`<div class="hd"><i class="lg tuv" data-slot="tuv" title="TÜV NORD ISO 9001"></i><i class="lg naq" data-slot="naqaae" title="NAQAAE"></i><i class="lg cur" data-slot="cur" title="Curriculum Committee FOMZU"></i><div class="fac"><div><b dir="rtl">كلية الطب البشري</b><span>Faculty of Medicine</span></div><i class="lg emb" data-slot="emb" title="Faculty of Medicine, Zagazig University"></i></div></div>`;
const FT=`<i class="wm" data-slot="wm"></i><div class="ft"><div class="zz"></div><p><span>📞 055/2307830</span><span class="cp">© 2026 Anas Mekawy. All rights reserved.</span><span>📠 055/2307830</span></p></div>`;
const PG=h=>`<article class="page">${HD}<div class="bd">${h}</div>${FT}</article>`;
const F=(l,t='text',v='')=>`<label class="f"><span>${l}</span>${t=='ta'?'<textarea rows="2"></textarea>':`<input type="${t}" value="${v}">`}</label>`;
const Z=l=>`<div class="zone" tabindex="0"><div class="zh noprint"><span>${l}</span><button type="button" class="b add">+ Add Image(s)</button><small>drag &amp; drop · click here and press Ctrl+V · drag the frame’s bottom-right corner to enlarge it</small></div><div class="imgs"></div></div>`;
const SH=(n,t,m)=>`<h2 class="sh"><span><b>Section ${n}</b> ${t}</span>${m?MK(m):''}</h2>`;
const SUB=(t,m)=>`<h3 class="sub"><span>${t}</span>${m?MK(m):''}</h3>`;
const ACT=(t,m,k,z)=>`<section class="card unit" data-u="${t}"><h4><span>${t}</span>${MK(m)}</h4><div class="g2">${F(`1. Title of the ${k}`)}${F('2. Date of attendance','date')}</div>${F('3. Brief description of the session content','ta')}${F('4. What did you learn from this session?','ta')}${Z(z)}</section>`;
const TOP=(t,m,s)=>`<section class="card unit" data-u="${t}"><h4><span>${t}</span>${MK(m)}</h4>${F('Title of the topic')}${F('Notes: flashcard, mind map, topic review, or learning notes','ta')}${Z('Image of your flashcard / mind map / notes')}</section>`;
const REF=(n,q,s)=>`<section class="card unit" data-u="Reflection ${n}"><h4><span>${n}. ${q}</span>${MK(.25)}</h4>${s?`<p class="note">${s}</p>`:''}<label class="f"><textarea rows="2"></textarea></label></section>`;
const SIGN=(r,n)=>`<div class="sl"><b>${r}</b>${n}</div>`;
const RUB=[['Section 1 — Evidence of Learning Activities',3.5],['Section 2 — Directed Self-Learning (incl. Incisional Academy)',1.25],['Section 3 — Self-Directed Learning',2],['Section 4 — Formative Assessment',.75],['Section 5 — Reflective Practice',1]];
const frow=n=>`<tr><td><input value="${n}" class="opt"></td><td><input></td><td><input></td><td><input></td><td><input></td><td class="noprint"><button class="rm" type="button" title="Remove row">✕</button></td></tr>`;
function build(){$('#pages').innerHTML=[
PG(`<div class="scroll"><h1>Undergraduate Zagazig medical student portfolio 2026-2027 (2023 bylaw)</h1></div><div class="frame"><i class="art a-cover" data-slot="cover" title="Portfolio cycle"></i></div>
<div class="stu unit" data-u="Student data">
<label>Student name:<input id="stuName" placeholder="Full name"></label><label>Group:<input></label><label>Phase:<input class="y" value="I"></label><label>Semester:<input class="y" value="S3"></label><label>Module:<input class="y" value="Endocrine &amp; Reproductive"></label><label>Mentor name:<input></label></div><p class="credit">made by Anas Mekawy | All rights are reserved</p>`),
PG(`<h2 class="sh" style="margin-top:4mm"><span>The Objectives of the student portfolio</span></h2><ol class="obj"><li>Provide documented evidence of students’ participation and engagement in practical and educational activities conducted under faculty supervision.</li><li>Support directed self-learning through structured academic tasks and learning activities assigned by faculty and documented within the portfolio.</li><li>Promote self-directed learning by encouraging students to undertake independent learning activities and provide evidence of their learning and achievements.</li><li>Develop reflective learning skills through structured self-reflection on students’ performance, learning experiences, strengths, and areas for improvement, supporting professional growth and lifelong learning.</li><li>Document formative feedback and selected graded components to support monitoring of students’ progress and achievement of the intended learning outcomes.</li></ol><aside class="notice"><button type="button" class="nx noprint" title="Remove this notice">✕</button><b>© Copyright notice</b><p>This work is for academic purposes only, and all rights are reserved. It may not be used for any commercial or business purposes without the author’s permission.</p></aside>`),
PG(`${SH(1,'Evidence of Learning Activities',3.5)}${SUB('1.1 Lectures',1)}<p class="note">Upload one quiz or assignment completed during the lectures of each speciality, as evidence of your participation and learning.</p>${['Anatomy','Physiology','Histology','Biochemistry'].map(s=>ACT(s+' Lecture',.25,'Lecture','Quiz or assignment completed during the lecture')).join('')}`),
PG(`${SUB('1.2 Practical Sessions',1)}<p class="note">Select one practical session from each subject (e.g., Anatomy, Physiology, Histology, Biochemistry) and document it as follows.</p>${['Anatomy','Physiology','Histology','Biochemistry'].map(s=>ACT(s+' Practical Session',.25,'Practical Session','Photo / evidence from the practical session')).join('')}`),
PG(`${SUB('1.3 Flipped Classroom Sessions',1)}<p class="note">Provide evidence of attendance and active participation in the Flipped Classroom session, including submission of the discussed clinical case with its structured questions and answers.</p>${[1,2,3,4].map(i=>`<section class="card unit" data-u="Flipped Session ${i}"><h4><span>Flipped Session ${i}</span>${MK(.25)}</h4>${F('Flipped session title')}${Z('Discussed clinical case with its structured questions and answers')}</section>`).join('')}`),
PG(`${SUB('1.4 Team-Based Learning (TBL)',.5)}<section class="card unit" data-u="TBL"><h4><span>Team Application (T-APP)</span>${MK(.5)}</h4><p class="note">Submit documented evidence of your participation in the Team-Based Learning (TBL): the completed case sheet discussed during the session, signed by the responsible faculty member, with the awarded grade clearly indicated.</p>${Z('Signed and graded T-APP case sheet')}<p style="margin:4mm 0 0"><label class="irat">I-RAT Score <input></label></p></section>
${SH(2,'Directed Self-Learning',.5)}${SUB('2.1 Assignments')}<p class="note">Upload a photo of your assignment sheet after it has been corrected and signed by the staff member, clearly showing your name and grade.</p>${['Histology','Physiology'].map(s=>`<section class="card unit" data-u="${s} Assignment"><h4><span>${s} Assignment</span>${MK(.25)}</h4>${F('Title of the assignment')}${Z('Corrected, signed and graded assignment sheet')}</section>`).join('')}`),
PG(`${SUB('2.2 Incisional Academy',.75)}<p class="note">Insert the certificates of the completed courses.</p>${[1,2,3].map(i=>`<section class="card unit" data-u="Incisional Academy Course ${i}"><h4><span>Course ${i}</span>${MK(.25)}</h4>${F('Title of the Course')}${Z('Certificate of the completed course')}</section>`).join('')}`),
PG(`${SH(3,'Self-Directed Learning',2)}<p class="note">Choose one topic for each subject and design a flash card, mind map, topic review, or learning notes about it.</p>${['Anatomy','Physiology','Histology','Biochemistry'].map(s=>TOP(s+' Topic',.5)).join('')}`),
PG(`${SH(4,'Formative Assessment',.75)}<h3 class="sub"><span>Worksheet of Formative Assessment</span></h3><section class="unit" data-any data-u="Formative worksheet"><table id="fw"><tr><th>Serial</th><th>Week</th><th>Topics</th><th>Score</th><th>Notes</th><th class="noprint"></th></tr>${[1,2,3].map(frow).join('')}</table><p class="noprint"><button type="button" class="b" id="addRow" style="margin-top:6px;background:#e5ecf6">+ Add Row</button></p></section><p class="note" style="margin-top:4mm">Insert a screenshot of your score from the formative assessment form in each box below.</p>${['1st','2nd','3rd'].map(o=>`<section class="card unit" data-u="${o} Formative Assessment"><h4><span>${o} Formative Assessment</span>${MK(.25)}</h4>${Z('Screenshot of your score')}</section>`).join('')}`),
PG(`${SH(5,'Reflective Practice',1)}<div style="width:34%;margin:0 auto 3mm"><i class="art a-refl" data-slot="refl" title="Importance of self reflection"></i></div>${REF(1,'What has gone well in this module?','Achievements, successes, and positive experiences')}${REF(2,'What has not gone well in this module?')}${REF(3,'What will you do differently after that?')}${REF(4,'What do you need more of in your learning process?')}`),
PG(`${SH(6,'Mentor Feedback &amp; Official Signatures')}<div style="width:44%;margin:0 auto 2mm"><i class="art a-feed" data-slot="feed" title="Feedback"></i></div><section class="card unit" data-any data-u="Mentor feedback"><h4><span>Mentor Feedback</span></h4><p class="note">Please copy the feedback provided by your mentor on Microsoft Teams (under the assignment link) and paste it in the space below. After inserting the feedback into this document, kindly re-upload the updated file to the same assignment link for your mentor.</p><label class="f"><textarea rows="4"></textarea></label>${Z('Teams feedback screenshot')}</section>
<section class="card unit sig" data-sig data-u="Academic Mentor’s signature"><h4><span>Academic Mentor’s Signature</span></h4><canvas width="800" height="240"></canvas><div class="row noprint"><button type="button" class="b sc">Clear</button><button type="button" class="b su">Upload signature image</button><small style="align-self:center">Sign with mouse, finger or stylus</small></div>${F('Mentor name (typed)')}</section>
<div class="sigs"><div class="g3">${SIGN('Portfolio Committee','Prof. Amira Alsemeh')}${SIGN('Vice Dean of Education &amp; Student Affairs','Prof. Mohamad Besher')}${SIGN('Dean of Faculty','Prof. Mahmoud Mostafa Taha')}</div><p class="credit">made by Anas Mekawy | All rights are reserved</p></div>`)
].join('');init()}
/* ---------- images ---------- */
const loadImg=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=r.result};r.onerror=no;r.readAsDataURL(f)});
function toURL(img,rot=0,png=false,max=1400){let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');const sw=rot%180;c.width=sw?h:w;c.height=sw?w:h;const x=c.getContext('2d');if(!png){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.translate(c.width/2,c.height/2);x.rotate(rot*Math.PI/180);x.drawImage(img,-w/2,-h/2,w,h);return png?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.82)}
const imItem=(src,w=48)=>`<figure class="im" style="width:${w}%" data-fit="contain"><div class="fr"><img src="${src}" alt=""></div><div class="tb noprint"><button type="button" data-a="30" title="Small 30%">S</button><button type="button" data-a="48" title="Medium 48%">M</button><button type="button" data-a="75" title="Large 75%">L</button><button type="button" data-a="100" title="Full 100%">Full</button><button type="button" data-a="fit" title="Fit (contain) / Crop (cover)">Fit/Crop</button><button type="button" data-a="rot" title="Rotate 90°">⟳</button><button type="button" data-a="zoom" title="Full-screen preview">⤢</button><button type="button" data-a="del" class="del" title="Delete">✕</button></div><input class="cap" placeholder="Add a caption (optional)"></figure>`;
const refZone=z=>z.classList.toggle('has',!!$('.im',z));
const fitArea=a=>{if(a&&a.scrollHeight>a.clientHeight+1)a.style.height=(a.scrollHeight+4)+'px'};
async function addFiles(z,files){for(const f of files){if(!f.type.startsWith('image/'))continue;try{const i=await loadImg(f);$('.imgs',z).insertAdjacentHTML('beforeend',imItem(toURL(i),files.length>1?48:75))}catch(e){}}refZone(z);changed()}
let lastZone=null,pickZone=null,pickSlot=null;
/* ---------- state ---------- */
function sync(){$$('input').forEach(i=>i.setAttribute('value',i.value));$$('textarea').forEach(t=>t.textContent=t.value);$$('.zone').forEach(refZone);$$('.cap').forEach(c=>c.setAttribute('value',c.value))}
const grow=t=>{t.style.height='auto';t.style.height=t.scrollHeight+4+'px'};
let T=0,savedAt=0;
function changed(){$$('.imgs').forEach(fitArea);sched();clearTimeout(T);T=setTimeout(async()=>{sync();progress();try{await kv('set','state',{pages:$('#pages').innerHTML,style:document.documentElement.getAttribute('style')||''});savedAt=Date.now();stamp()}catch(e){$('#saved').textContent='Auto-save unavailable in this browser'}},700);progress()}
function stamp(){if(savedAt){const m=Math.floor((Date.now()-savedAt)/60000);$('#saved').textContent=m<1?'Last saved just now':`Last saved ${m} min ago`}}
setInterval(stamp,30000);
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('fomzu-endo-portfolio',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no()});
const kv=async(m,k,v)=>{const d=await idb();return new Promise((ok,no)=>{const s=d.transaction('kv',m=='get'?'readonly':'readwrite').objectStore('kv');const q=m=='get'?s.get(k):m=='set'?s.put(v,k):s.delete(k);q.onsuccess=()=>ok(q.result);q.onerror=no})};
/* ---------- progress ---------- */
function isFilled(u){if(u.hasAttribute('data-sig'))return !!($('canvas',u).dataset.png)||$$('input',u).some(i=>i.value.trim());const v=[...$$('input:not(.cap):not(.opt),textarea',u).map(x=>x.value.trim()!==''),...$$('.zone',u).map(z=>!!$('.im',z))];return u.hasAttribute('data-any')?v.some(Boolean):v.length>0&&v.every(Boolean)}

/* ---------- auto pagination ---------- */
let pT=0,paging=false;const sched=()=>{clearTimeout(pT);pT=setTimeout(paginate,150)};
function paginate(){if(paging)return;const P=$$('.page');if(!P.length)return;const pw=P[0].getBoundingClientRect().width;if(pw<790)return;paging=true;
 const mm=pw/210,a=document.activeElement,ss=a&&a.selectionStart,se=a&&a.selectionEnd,sy=scrollY;
 let org=null;$$('.card').forEach(c=>{if(c.dataset.cont&&org){while(c.firstChild)org.appendChild(c.firstChild);c.remove()}else org=c});
 const cap=297*mm-$('.hd',P[0]).offsetHeight-parseFloat(getComputedStyle($('.bd',P[0])).paddingTop)-23*mm;
 const hOf=b=>{const s=getComputedStyle(b);return b.offsetHeight+parseFloat(s.marginTop)+parseFloat(s.marginBottom)};
 const glue=b=>b.matches('.sh,.sub,.note');
 const groups=[];P.forEach(p=>{if(p.dataset.cont&&groups.length)groups[groups.length-1].push(p);else groups.push([p])});
 groups.forEach(g=>{const blocks=g.flatMap(p=>[...$('.bd',p).children]),hs=new Map(blocks.map(b=>[b,hOf(b)]));
  const units=[];let pend=[];blocks.forEach(b=>{pend.push(b);if(!glue(b)){units.push(pend);pend=[]}});if(pend.length)units.push(pend);
  const pages=[[]],frags=[];let used=0;const cur=()=>pages[pages.length-1],nxt=()=>{pages.push([]);used=0};
  units.forEach(u=>{const last=u[u.length-1],uh=u.reduce((s,b)=>s+hs.get(b),0);
   if(uh>cap&&last.matches('.card')&&last.children.length>1){
    const pre=u.slice(0,-1),preH=pre.reduce((s,b)=>s+hs.get(b),0),kids=[...last.children],kh=kids.map(hOf),over=Math.max(0,hs.get(last)-kh.reduce((s,x)=>s+x,0));
    if(used>0&&used+preH+over+kh[0]>cap)nxt();
    cur().push(...pre);used+=preH;
    let shell=last,ks=[],h=over;
    kids.forEach((k,i)=>{if(ks.length&&used+h+kh[i]>cap){frags.push([shell,ks]);cur().push(shell);nxt();shell=document.createElement('section');shell.className='card';shell.dataset.cont='1';ks=[];h=over}ks.push(k);h+=kh[i]});
    frags.push([shell,ks]);cur().push(shell);used+=h;return}
   if(used>0&&used+uh>cap)nxt();cur().push(...u);used+=uh});
  frags.forEach(([s,k])=>k.forEach(x=>s.appendChild(x)));
  while(g.length<pages.length){const tp=document.createElement('template');tp.innerHTML=PG('');const el=tp.content.firstElementChild;el.dataset.cont='1';g[g.length-1].after(el);g.push(el)}
  while(g.length>pages.length){g.pop().remove()}
  g.forEach((p,i)=>{const bd=$('.bd',p),c=[...bd.children],want=pages[i];if(c.length==want.length&&c.every((x,k)=>x===want[k]))return;want.forEach(x=>bd.appendChild(x))})});
 if(a&&a!==document.activeElement&&document.contains(a)){a.focus({preventScroll:true});try{a.setSelectionRange(ss,se)}catch(e){}}
 scrollTo(0,sy);paging=false}
