<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zagazig Medical Student Portfolio 2026-2027 - Endocrine &amp; Reproductive</title>
<style>
:root{--navy:#14285a;--blue:#1f6fb5;--mark:#c62828;--line:#c9d3e6;--bg:#e9edf5;--soft:#f3f6fb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font:15px/1.5 "Segoe UI",Tahoma,Arial,sans-serif;color:#1b2333}
h1,h2,h3,.ser{font-family:Cambria,"Times New Roman",serif}
.bar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;direction:rtl}
.bar button{font:inherit;border:0;border-radius:6px;padding:6px 12px;background:var(--blue);color:#fff;cursor:pointer}
.bar button.r{background:#8a1c1c}.bar button:hover{filter:brightness(1.15)}
.prog{flex:1;min-width:180px;display:flex;align-items:center;gap:8px}
.track{flex:1;height:10px;background:#ffffff33;border-radius:6px;overflow:hidden}
.fill{height:100%;width:0;background:#6fd08c;transition:width .3s}
.pages{padding:14px 0}
.page{position:relative;width:210mm;max-width:100%;min-height:297mm;margin:0 auto 14px;background:#fff;border:3px solid var(--navy);box-shadow:0 2px 10px #0003;padding:0 14mm 22mm;overflow:hidden}
.page::before{content:"Faculty of Medicine · Zagazig University";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font:700 54px Cambria,serif;color:#14285a0d;transform:rotate(-30deg);pointer-events:none;padding:30px}
.page>*{position:relative}
.hd{margin:0 -14mm 10px;padding:8px 14mm;border-bottom:3px solid var(--navy);text-align:center}
.hd img{max-width:100%;height:64px;object-fit:contain}
.ft{position:absolute!important;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:5px 14mm;background:var(--navy);color:#fff;font-weight:700;font-size:13px}
h1{font-size:26px;text-align:center;margin:8px 0}
h2{font-size:21px;color:var(--navy);margin:12px 0 4px}
h3{font-size:17px;margin:0 0 8px;color:var(--navy)}
.m{color:var(--mark);font-weight:700;white-space:nowrap}
.sub{font-weight:700;color:var(--blue);margin:8px 0 2px;font-family:Cambria,serif;font-size:17px}
.intro{margin:4px 0 8px;font-weight:600}
.card{background:var(--soft);border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:8px;padding:10px 12px;margin:10px 0}
label{display:block;font-weight:600;color:var(--blue);margin:6px 0 2px;font-family:Cambria,serif}
input,textarea{width:100%;font:inherit;padding:6px 8px;border:1px solid #9fb0d0;border-radius:6px;background:#fff}
textarea{resize:none;overflow:hidden;min-height:56px}
input:focus,textarea:focus{outline:2px solid var(--blue)}
.ph{border:2px dashed #7f98c6;border-radius:8px;min-height:90px;padding:8px;background:#fff;margin-top:4px}
.ph.on{background:#e3eeff}
.hint{color:#5a6a8a;font-size:13px;text-align:center;direction:rtl}
.hint button,.tb button{font:inherit;font-size:13px;border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:5px;padding:2px 8px;cursor:pointer}
.th{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.th div{position:relative}.th img{max-height:220px;max-width:100%;border:1px solid var(--line);border-radius:4px;display:block}
.th b{position:absolute;top:2px;right:2px;background:#c62828;color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;cursor:pointer;font-weight:400}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{border:1px solid #8ea2c8;padding:3px;text-align:left}th{background:#dfe9f7;color:var(--navy)}
td input{border:0;border-radius:0;padding:4px}
.cover{text-align:center}
.ban{background:#d9d9d9;border:3px solid var(--navy);border-radius:14px;padding:6px 10px;margin:14px 0}
.ban h1{margin:4px}
.cv img{width:100%;border-radius:12px;border:1px solid var(--line)}
.id{background:#4f81bd;border:3px solid var(--navy);border-radius:36px;padding:18px 26px;margin:16px 0;text-align:left;color:#fff}
.id label{color:#fff;font-size:19px;font-weight:700}
.id input{background:transparent;border:0;border-bottom:2px dotted #fff;border-radius:0;color:#ffe94d;font-weight:700;font-size:17px}
ol.ob{font-size:16px;text-align:justify}ol.ob li{margin:8px 0}
.dots{height:28px;border-bottom:2px dotted #666}
.fb{border:2px solid #000;padding:8px;margin:10px 0}
.fb h3{text-align:center;text-decoration:underline;color:#000}
@media(max-width:700px){.page{padding:0 10px 40px;min-height:0}.hd{margin:0 -10px 8px;padding:6px 10px}.ft{padding:5px 10px}.page::before{font-size:30px}.id{padding:12px 14px}}
@media print{@page{size:A4;margin:0}body{background:#fff}.bar,.hint,.th b,.tb,.noexp{display:none!important}.pages{padding:0}
.page{margin:0;border:3px solid var(--navy);box-shadow:none;width:210mm;min-height:297mm;page-break-after:always;break-after:page}
.card{break-inside:avoid}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>

 if(x.type=='d')return `<label>${x.l}</label><input type="date" data-k="${k}">`;
 if(x.type=='a')return (x.l?`<label>${x.l}</label>`:'')+`<textarea data-k="${k}" dir="auto"></textarea>`;
 if(x.type=='p')return `<label>${x.l}</label><div class="ph" tabindex="0" data-p="${k}"><div class="th"></div><div class="hint noexp">اسحب الصور هنا · أو الصق بـ Ctrl+V · أو <button type="button" data-add="${k}">إضافة صورة</button></div></div>`;
 if(x.type=='tb')return `<table data-t="${k}"><thead><tr><th style="width:60px">Serial</th><th style="width:80px">Week</th><th>Topics</th><th style="width:70px">score</th><th>Notes</th><th class="tb" style="width:34px"></th></tr></thead><tbody></tbody></table><div class="tb" style="margin-top:6px"><button type="button" data-row="${k}">+ إضافة صف</button></div>`}
function blk(b){let h='';
 if(b.cover)return `<div class="cover"><div class="ban"><h1>Undergraduate Zagazig medical student portfolio 2026-2027<br>(2023 bylaw)</h1></div><div class="cv"><img src="${CVR}" alt=""></div><div class="id">${[['name','Student name:'],['grp','Group:'],['ph','Phase:'],['sem','Semester:'],['mod','Module:'],['men','Mentor name:']].map(a=>`<label>${a[1]}</label><input data-k="cv_${a[0]}" dir="auto">`).join('')}</div></div>`;
 if(b.fb)return `<h2 style="text-align:center;color:var(--navy)">Feedback</h2><p style="font-weight:700">Please copy the feedback provided by your mentor on Microsoft Teams (under the assignment link) and paste it in the space below 👇.<br>After inserting the feedback into this document, kindly re-upload the updated file to the same assignment link for your mentor.</p><div class="fb"><h3>Mentor feedback</h3>${'<div class="dots"></div>'.repeat(9)}</div><p style="font-weight:700">Academic mentor’s signature……</p><div style="border-bottom:2px solid #000;width:55%;height:26px"></div><p style="margin-top:24px"><b style="color:#c00000;font-size:16px">Portfolio committee</b><br><i>Prof. Amira Alsemeh</i></p><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;color:var(--blue);font-weight:700"><span>Vice Dean of Education &amp;Student Affairs<br><i style="color:#000">Prof. Mohamad Besher</i></span><span>Dean of Faculty<br><i style="color:#000">Prof. Mahmoud Mostafa Taha</i></span></div>`;
 if(b.h)h+=`<h2>${b.h}${b.m?` <span class="m">${b.m}</span>`:''}</h2>`;
 else if(b.m&&b.p)h+=`<p class="intro">${b.p} <span class="m">${b.m}</span></p>`;
 if(b.h&&b.p)h+=`<p class="intro">${b.p}</p>`;
 if(b.ol)h+=`<ol class="ob">${b.ol.map(o=>`<li>${o}</li>`).join('')}</ol>`;
 if(b.sub)h+=`<div class="sub">${b.sub}</div>`;
 if(!b.h&&!b.m&&b.p)h+=`<p class="intro">${b.p}</p>`;
 if(b.rub){const tot=RUB.reduce((a,r)=>a+r[1],0);h+=`<table><tr><th>Component</th><th style="width:90px">Max mark</th><th style="width:110px">Awarded</th></tr>${RUB.map((r,i)=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td><input data-k="rub${i}" dir="auto"></td></tr>`).join('')}<tr><th>Total</th><th>${tot}</th><td><input data-k="rubT"></td></tr></table>`}
 if(b.c)h+=`<div class="card" data-card="${b.f.map(x=>x.k).join(',')}"><h3>${b.t} <span class="m">${b.m}</span></h3>${b.p?`<p class="intro">${b.p}</p>`:''}${b.f.map(fld).join('')}</div>`;
 return h}
document.getElementById('pages').innerHTML=PAGES.map((p,i)=>`<section class="page">${HF(p.map(blk).join(''))}</section>`).join('');
// defaults
if(S.cv_ph===undefined)S.cv_ph='I';if(S.cv_sem===undefined)S.cv_sem='S3';if(S.cv_mod===undefined)S.cv_mod='Endocrine & Reproductive';
const grow=t=>{t.style.height='auto';t.style.height=t.scrollHeight+2+'px'};
function rows(k){const tb=document.querySelector(`[data-t="${k}"] tbody`);const r=S[k]=S[k]||[['','','',''],['','','',''],['','','','']];
 tb.innerHTML=r.map((x,i)=>`<tr><td style="text-align:center;font-weight:700">${i+1}</td>${x.map((v,j)=>`<td><input dir="auto" data-r="${k}" data-i="${i}" data-j="${j}" value="${esc(v)}"></td>`).join('')}<td class="tb"><button type="button" data-del="${k}" data-i="${i}">×</button></td></tr>`).join('')}
function ph(k){const el=document.querySelector(`[data-p="${k}"] .th`);el.innerHTML=(S[k]||[]).map((s,i)=>`<div><img src="${s}"><b class="noexp" data-rm="${k}" data-i="${i}">×</b></div>`).join('')}
function load(){document.querySelectorAll('[data-k]').forEach(e=>{if(S[e.dataset.k]!==undefined)e.value=S[e.dataset.k];if(e.tagName=='TEXTAREA')grow(e)});
 document.querySelectorAll('[data-p]').forEach(e=>ph(e.dataset.p));document.querySelectorAll('[data-t]').forEach(e=>rows(e.dataset.t));prog()}
function filled(k){const v=S[k];return Array.isArray(v)?v.some(x=>Array.isArray(x)?x.some(y=>String(y).trim()):x):!!(v&&String(v).trim())}
function prog(){const cs=[...document.querySelectorAll('[data-card]')];const d=cs.filter(c=>c.dataset.card.split(',').some(filled)).length;const p=cs.length?Math.round(d/cs.length*100):0;
 document.getElementById('pt').textContent=`${d} / ${cs.length} (${p}%)`;document.getElementById('pf').style.width=p+'%'}
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.k){S[t.dataset.k]=t.value;if(t.tagName=='TEXTAREA')grow(t)}
 else if(t.dataset.r){S[t.dataset.r][t.dataset.i][t.dataset.j]=t.value}prog()});
function pack(file){return new Promise(ok=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=1400,s=Math.min(1,m/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*s;cv.height=im.height*s;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(im,0,0,cv.width,cv.height);ok(cv.toDataURL('image/jpeg',.82))};im.onerror=()=>ok(null);im.src=r.result};r.readAsDataURL(file)})}
async function addFiles(k,fl){for(const f of fl){if(!f.type.startsWith('image/'))continue;const d=await pack(f);if(d){(S[k]=S[k]||[]).push(d)}}ph(k);prog()}
document.addEventListener('click',e=>{const t=e.target,d=t.dataset;
 if(d.add){const i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=true;i.onchange=()=>addFiles(d.add,i.files);i.click()}
 if(d.rm){S[d.rm].splice(+d.i,1);ph(d.rm);prog()}
 if(d.row){S[d.row].push(['','','','']);rows(d.row)}
 if(d.del){if(S[d.del].length>1)S[d.del].splice(+d.i,1);rows(d.del);prog()}
 const z=t.closest&&t.closest('.ph');if(z)last=z});
let last=null;
document.querySelectorAll('.ph').forEach(z=>{z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('on')});z.addEventListener('dragleave',()=>z.classList.remove('on'));
 z.addEventListener('drop',e=>{e.preventDefault();z.classList.remove('on');addFiles(z.dataset.p,e.dataTransfer.files)});z.addEventListener('focus',()=>last=z)});
document.addEventListener('paste',e=>{const z=last||document.activeElement.closest&&document.activeElement.closest('.ph');if(!z)return;const fl=[...e.clipboardData.files];if(fl.length){e.preventDefault();addFiles(z.dataset.p,fl)}});
const dl=(name,data,type)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click()};
const fname=()=>'Portfolio_'+((S.cv_name||'student').replace(/[^\w\u0600-\u06FF]+/g,'_'));
function saveHTML(){const s=document.getElementById('saved');s.textContent=JSON.stringify(S).replace(/</g,'\\u003c');dl(fname()+'.html','<!DOCTYPE html>\n'+document.documentElement.outerHTML,'text/html');s.textContent='{}'}
function saveWord(){const r=document.getElementById('pages').cloneNode(true);r.querySelectorAll('.noexp,.tb,.hd img+*').forEach(e=>{if(!e.classList.contains('hd'))e.remove()});
 r.querySelectorAll('input,textarea').forEach(i=>{const d=document.createElement('div');d.style.cssText='border-bottom:1px dotted #888;min-height:16px;white-space:pre-wrap';d.textContent=i.value||(i.type=='date'?'':'')||'';const v=i.tagName=='TEXTAREA'?i.value:i.value;d.textContent=v;i.replaceWith(d)});
 r.querySelectorAll('.ph').forEach(p=>{if(!p.querySelector('img'))p.innerHTML='<i>—</i>'});
 r.querySelectorAll('.page').forEach(p=>p.setAttribute('style','page-break-after:always;border:0'));
 const css='body{font-family:Cambria,serif;font-size:11pt}h2{color:#14285a}h3{color:#14285a}.m{color:#c62828;font-weight:bold}label{color:#1f6fb5;font-weight:bold;display:block}table{border-collapse:collapse;width:100%}td,th{border:1px solid #666;padding:3px}img{max-width:420px}.card{border:1px solid #9fb0d0;padding:6px;margin:6px 0}.ft{display:none}';
 dl(fname()+'.doc','<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>'+css+'</style></head><body>'+r.innerHTML+'</body></html>','application/msword')}
function resetAll(){if(!confirm('مسح كل البيانات والصور؟ / Clear all data and images?'))return;S={cv_ph:'I',cv_sem:'S3',cv_mod:'Endocrine & Reproductive'};document.querySelectorAll('[data-k]').forEach(e=>{e.value='';if(e.tagName=='TEXTAREA')e.style.height=''});load()}
load();
</script></body></html>
